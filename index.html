<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BLE 測試</title>
</head>
<body>
  <h2>Web Bluetooth 掃描測試</h2>
  
  <!-- 點擊後會用 iOS Scheme 開啟 Bluefy 並自動帶入網址 -->
  <a href="bluefy://https://rsvp-arashi.github.io/ble-test/" 
     style="display:inline-block; padding:10px 20px; background-color:#007AFF; color:white; text-decoration:none; border-radius:8px; margin-bottom:15px;">
    點此用 Bluefy 開啟此頁面
  </a>

  <br><br>
  <button onclick="scanBLE()" style="padding:10px 20px;">搜尋裝置</button>
  <div id="log" style="margin-top:15px;"></div>

  <script>
    async function scanBLE() {
      const logDiv = document.getElementById('log');
      try {
        logDiv.innerText = '正在搜尋藍牙裝置...';
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true
        });
        logDiv.innerText = `已成功連接到裝置: ${device.name || '未命名裝置'} (ID: ${device.id})`;
      } catch (error) {
        logDiv.innerText = '錯誤: ' + error.message;
      }
    }
  </script>
</body>
</html>
