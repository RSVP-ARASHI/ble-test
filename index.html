<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BLE 測試</title>
</head>
<body>
  <h2>Web Bluetooth 掃描測試</h2>
  <button onclick="scanBLE()">搜尋裝置</button>
  <div id="log"></div>

  <script>
    async function scanBLE() {
      const logDiv = document.getElementById('log');
      try {
        logDiv.innerText = '正在搜尋藍牙裝置...';
        // 請求藍牙裝置（acceptAllDevices 需配合必要服務設定）
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true
        });
        logDiv.innerText = `已成功連接到裝置: ${device.name || '未命名裝置'} (ID: ${device.id})`;
      } catch (error) {
        logDiv.innerText = '錯誤: ' + error.message;
      }
    }
  </script>
</body>
</html>
